                          >
                            GET PATTERN NOW
                          </button>
                        </div>
                      </div>
                    </div>
                  ))}

              </div>

            {/* VIEW 3: PATTERN DETAIL */}
            {currentView === 'detail' && activePattern && (

                  <div className="relative w-full h-[220px] sm:h-auto sm:aspect-[3/4] rounded-2xl overflow-hidden bg-stone-100 border border-stone-200 shadow-sm">

                      src={activePattern.image_url}
                      alt={activePattern.title}
                      className="w-full h-full object-cover pointer-events-none select-none"
                    />
                  </div>

                  <div className="flex flex-col gap-5">
                    <div>
                      <div className="flex items-center gap-2 mb-2">
                        <span className="text-xs font-semibold uppercase tracking-wider text-[#7D3EAB] bg-[#BF8CE3]/20 px-2.5 py-0.5 rounded-full">

                      <div className="flex items-center gap-2 mb-4 text-xs font-normal text-stone-900 flex-wrap">

                          <span className="font-semibold">{activePattern.rating || 5}</span>
                          <span className="text-stone-500">({activePattern.reviews_count || 128} reviews)</span>
                        </span>
                        <span className="text-stone-300">·</span>
                        <span className="text-stone-700 font-mono">{activePattern.pdf_size}</span>
                        <span className="text-stone-300">·</span>
                        <span className="text-emerald-700 font-medium">94 downloads</span>

                          <span className="font-semibold text-stone-900">High-Res Printable PDF</span>

                          BUY IT NOW $2.00

                          value={adminKey}
                          onChange={(e) => setAdminKey(e.target.value)}

                                <td className="py-3 px-4 font-mono text-[11px] text-stone-500 max-w-xs truncate">

                                <td className="py-3 px-4 text-right space-x-1">
                                  <button
                                    onClick={() => openDetail(pattern.slug)}
                                    className="p-1 text-stone-500 hover:text-stone-900 cursor-pointer"
                                    title="View"
                                  >
                                    👁️
                                  </button>
                                  <button
                                    onClick={() => openEditModal(pattern)}
                                    className="p-1 text-stone-500 hover:text-stone-900 cursor-pointer"
                                    title="Edit"
                                  >
                                    ✏️
                                  </button>
                                  <button
                                    onClick={() => handleDelete(pattern.id)}
                                    className="p-1 text-stone-500 hover:text-red-600 cursor-pointer"
                                    title="Delete"
                                  >
                                    🗑️
                                  </button>
                                </td>
                              </tr>
                            ))}
                          </tbody>

                    </div>

                    {showModal && (

                          <h2 className="text-base font-bold text-[#2D1C17] mb-1">

                          <form onSubmit={handleFormSubmit} className="space-y-3 mt-4">
                            <div>
                              <label className="block font-semibold mb-1">Title *</label>
                              <input
                                type="text"
                                value={formTitle}
                                onChange={(e) => setFormTitle(e.target.value)}
                                className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded text-xs"
                                required
                              />
                            </div>
                            <div>
                              <label className="block font-semibold mb-1">Image URL *</label>
                              <input
                                type="text"
                                value={formImageUrl}
                                onChange={(e) => setFormImageUrl(e.target.value)}
                                className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded text-xs"
                                required
                              />
                            </div>
                            <div className="grid grid-cols-2 gap-2">
                              <div>
                                <label className="block font-semibold mb-1">PDF Size *</label>
                                <input
                                  type="text"
                                  value={formPdfSize}
                                  onChange={(e) => setFormPdfSize(e.target.value)}
                                  className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded text-xs"
                                  required
                                />
                              </div>
                              <div>
                                <label className="block font-semibold mb-1">Difficulty *</label>
                                <input
                                  type="text"
                                  value={formDifficultyTag}
                                  onChange={(e) => setFormDifficultyTag(e.target.value)}
                                  className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded text-xs"
                                  required
                                />
                              </div>
                            </div>
                            <div>
                              <label className="block font-semibold text-[#E65F43] mb-1">CPA Locker URL *</label>
                              <input
                                type="url"
                                value={formCpaLockerUrl}
                                onChange={(e) => setFormCpaLockerUrl(e.target.value)}
                                className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded text-xs font-mono"
                                required
                              />
                            </div>
                            <div>
                              <label className="block font-semibold mb-1">Gumroad URL (Optional)</label>
                              <input
                                type="url"
                                value={formGumroadUrl}
                                onChange={(e) => setFormGumroadUrl(e.target.value)}
                                className="w-full px-3 py-2 bg-stone-50 border border-stone-200 rounded text-xs font-mono"
                              />
                            </div>
                            <div className="flex items-center gap-2 pt-1">
                              <input
                                type="checkbox"
                                id="bs-check"
                                checked={formIsBestSeller}
                                onChange={(e) => setFormIsBestSeller(e.target.checked)}
                              />
                              <label htmlFor="bs-check" className="font-semibold cursor-pointer">Mark as Best Seller</label>
                            </div>
                            <div className="flex justify-end gap-2 pt-3 border-t border-stone-100">
                              <button
                                type="button"
                                onClick={() => setShowModal(false)}
                                className="px-3 py-2 text-stone-600 hover:text-stone-900 cursor-pointer"
                              >
                                Cancel
                              </button>
                              <button
                                type="submit"
                                className="px-4 py-2 bg-[#E65F43] text-white font-bold rounded cursor-pointer"
                              >
                                Save Pattern
                              </button>
                            </div>
                          </form>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}
          </main>

          {/* FOOTER */}
          <footer className="mt-auto border-t border-stone-100 bg-white text-stone-500 text-xs py-10 text-center">
            <div className="max-w-7xl mx-auto px-4 space-y-2">
              <p className="text-sm font-bold tracking-[0.2em] uppercase text-stone-900">TRENDY CROCHET</p>
              <p className="text-stone-500 text-xs max-w-md mx-auto">
                Your source for wall-worthy, wearable crochet art patterns and instant printable PDF guides.
              </p>
              <p className="text-stone-400 text-[11px] pt-1">
                © {new Date().getFullYear()} Trendy Crochet. 100% Free Instant Downloads.
              </p>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
